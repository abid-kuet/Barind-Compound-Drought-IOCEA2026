domain:
  name: "Rajshahi Division, NW Bangladesh"
  n_grid_cells: 26
  grid_resolution_deg: 0.25
  centroid_lat: 24.5865
  centroid_lon: 89.0385
  grid_points_file: "data/Rajshahi_grid_points.csv"
  boundary_file: "data/study_area_boundary_digitised.csv"

periods:
  baseline: [1986, 2014]
  split_cal: [1986, 2000]
  split_val: [2001, 2014]
  future_full: [2015, 2100]
  future_late: [2071, 2100]

paths:
  era5_daily: "data/raw/era5_matched_daily.csv"
  bmd_stations: "data/raw/Observed_3_Stations.xlsx"
  cmip6_dir: "data/raw/cmip6_workbooks"
  output_dir: "outputs"

cmip6:
  candidate_models:
    - ACCESS-CM2
    - ACCESS-ESM1-5
    - BCC-CSM2-MR
    - CanESM5
    - EC-Earth3
    - EC-Earth3-Veg
    - INM-CM4-8
    - INM-CM5-0
    - MPI-ESM1-2-HR
    - MPI-ESM1-2-LR
    - MRI-ESM2-0
    - NorESM2-LM
    - NorESM2-MM

  selected_top5:
    - EC-Earth3-Veg
    - MPI-ESM1-2-LR
    - BCC-CSM2-MR
    - EC-Earth3
    - NorESM2-MM

drought_indices:
  scales: [3, 6, 12]
  primary_scale: 6
  spei_dist: "fisk"
  spi_dist: "gamma"

topsis:
  criteria: [P_KGE, P_Bias_abs, P_r, Tmax_KGE, Tmin_KGE, Tmean_Bias_abs]
  impacts: ["+", "-", "+", "+", "+", "-"]
  weights: [0.1666667, 0.1666667, 0.1666667, 0.1666667, 0.1666667, 0.1666667]

copula:
  families: [gaussian, clayton, gumbel, frank, joe]
  tmax_quantile: 0.90
  spei_threshold: -1.5
  block_bootstrap_len: 12
  n_boot: 1000
  conf_level: 0.95

markov:
  wmo_thresholds: [-0.5, -1.0, -1.5]
  usdm_thresholds: [-0.84, -1.28, -1.50]
  state_names: [Normal, Mild, Moderate, Severe]
  n_boot: 1000
  conf_level: 0.95

xgboost:
  target: "SPEI_6"
  lags: 6
  cv_folds: 5
  purge_months: 6
  seed: 42
  params:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 2.0
    min_child_weight: 3
